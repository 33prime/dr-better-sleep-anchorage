[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  path = "/api/chat"
  function = "chat"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
