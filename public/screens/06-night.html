<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Night · Anchorage</title>
<!-- Screen 06 — Night / sleep-tracking. Almost-black, breathing gradient, low-contrast type. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_anchorage.css">
<style>
  .screen.night .status-bar { color: rgba(220,230,226,0.55); }

  .stage {
    position: relative; z-index: 1;
    height: calc(100% - 47px);
    display: flex; flex-direction: column;
    padding: 24px 28px 36px;
    color: var(--night-text-1);
  }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    color: var(--night-text-3);
  }
  .top .label-mono { color: var(--night-text-3); }
  .top .moon {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .top .moon::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #B5D6CB, #6FA796 60%, #325447);
  }

  .center {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }

  .verb {
    font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400;
    font-size: 36px; color: var(--night-text-1);
    letter-spacing: -0.01em;
    opacity: 0.92;
  }

  /* breathing orb */
  .orb {
    width: 220px; height: 220px;
    margin: 32px 0 28px;
    border-radius: 50%;
    position: relative;
    background:
      radial-gradient(circle at 38% 36%, rgba(181,214,203,0.55) 0%, rgba(111,167,150,0.18) 38%, rgba(11,20,22,0) 70%);
    animation: orbBreath 5s ease-in-out infinite;
  }
  .orb::before {
    content: ""; position: absolute; inset: 18%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(220,230,226,0.18), rgba(20,36,42,0.6) 60%, rgba(6,11,13,0.9));
    box-shadow:
      inset 0 0 60px rgba(134,200,184,0.10),
      0 0 80px rgba(134,200,184,0.10);
  }
  .orb::after {
    /* halo ring */
    content: ""; position: absolute; inset: -6%;
    border-radius: 50%;
    border: 1px solid rgba(134,200,184,0.18);
    animation: ring 5s ease-in-out infinite;
  }
  @keyframes orbBreath {
    0%, 100% { transform: scale(1);    filter: brightness(0.95); }
    50%      { transform: scale(1.04); filter: brightness(1.1); }
  }
  @keyframes ring {
    0%, 100% { transform: scale(1);   opacity: 0.6; }
    50%      { transform: scale(1.06); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb, .orb::after, .screen.night::before { animation: none !important; }
  }

  .clock {
    font-family: "JetBrains Mono", monospace; font-weight: 300;
    font-size: 56px; letter-spacing: -0.04em;
    color: var(--night-text-1);
    text-shadow: 0 0 40px rgba(134,200,184,0.12);
  }
  .clock-cap {
    margin-top: 8px;
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--night-text-3);
  }

  /* live signals strip */
  .signals {
    margin-top: 36px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--hairline-night);
    border-radius: 14px;
    overflow: hidden;
  }
  .signals .s {
    background: rgba(11,20,22,0.4);
    padding: 14px 12px;
    text-align: left;
  }
  .signals .k { font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--night-text-3); }
  .signals .v { font-family: "JetBrains Mono", monospace; font-weight: 300; font-size: 22px; letter-spacing: -0.04em; color: var(--night-text-1); margin-top: 4px; }
  .signals .t { font-size: 10px; color: var(--night-text-2); margin-top: 4px; }

  .footer-row {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--hairline-night);
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
  }
  .end {
    flex: 1;
    text-align: center;
    padding: 14px 16px;
    border: 1px solid var(--hairline-night);
    border-radius: 999px;
    color: var(--night-text-2);
    font-family: "Instrument Serif", serif; font-style: italic;
    font-size: 16px;
  }
  .device-pill {
    flex: none;
    padding: 10px 14px; border-radius: 999px;
    background: rgba(134,200,184,0.08);
    border: 1px solid rgba(134,200,184,0.18);
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent-soft);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .device-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-soft); box-shadow: 0 0 8px rgba(134,200,184,0.6); animation: pulse 2.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* faint waveform behind orb area */
  .wave-wrap {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    height: 60px; opacity: 0.18; pointer-events: none;
  }
  .wave-wrap svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="device" data-screen-label="06 Night">
    <div class="screen night">
      <div class="status-bar">
        <div class="time">2:14</div>
        <div class="island"></div>
        <div class="right">
          <svg viewBox="0 0 18 12" fill="currentColor" style="width:18px;height:12px; opacity:0.7;"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="6" width="3" height="6" rx="0.5"/><rect x="10" y="3" width="3" height="9" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
          <svg viewBox="0 0 16 12" fill="currentColor" style="width:15px;height:11px; opacity:0.7;"><path d="M8 11.2a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8Z"/><path d="M8 7.5c1.4 0 2.7.5 3.7 1.4l1.5-1.5A8 8 0 0 0 8 5.3a8 8 0 0 0-5.2 2.1l1.5 1.5A5.4 5.4 0 0 1 8 7.5Z"/><path d="M8 3.6a10.4 10.4 0 0 1 7.4 3l-1.5 1.5A8.4 8.4 0 0 0 8 5.6a8.4 8.4 0 0 0-5.9 2.5L0.6 6.6A10.4 10.4 0 0 1 8 3.6Z"/></svg>
          <svg viewBox="0 0 26 12" fill="none" style="width:24px;height:11px;"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="11" height="8" rx="1.5" fill="currentColor" opacity="0.7"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.4"/></svg>
        </div>
      </div>

      <div class="stage">
        <div class="top">
          <div class="label-mono">Tracking</div>
          <div class="moon">Tue · 02:14</div>
        </div>

        <div class="center">
          <div class="verb">Sleeping.</div>

          <div style="position:relative; display:flex; align-items:center; justify-content:center;">
            <div class="wave-wrap">
              <svg viewBox="0 0 360 60" preserveAspectRatio="none">
                <path d="M0,30 Q 20,12 40,30 T 80,30 T 120,30 T 160,30 T 200,30 T 240,30 T 280,30 T 320,30 T 360,30"
                      fill="none" stroke="#86C8B8" stroke-width="1" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="orb"></div>
          </div>

          <div class="clock">04:21</div>
          <div class="clock-cap">Asleep · Since 9:53 pm</div>
        </div>

        <div class="signals">
          <div class="s">
            <div class="k">Stage</div>
            <div class="v">Deep</div>
            <div class="t">22 min in</div>
          </div>
          <div class="s">
            <div class="k">Snores</div>
            <div class="v">8</div>
            <div class="t">last hour</div>
          </div>
          <div class="s">
            <div class="k">Pulse</div>
            <div class="v">52</div>
            <div class="t">↓ from 58</div>
          </div>
        </div>

        <div class="footer-row">
          <div class="end" data-href="03-morning-reveal.html">End night</div>
          <div class="device-pill" data-href="10-device-overview.html">Device · Pos. 3</div>
        </div>
      </div>
    </div>
  </div>
  <div class="caption">Screen 06 · Night / Sleep Tracking</div>
</body>
</html>
