<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Dr. Never Snore</title>
<meta name="description" content="Dr. Never Snore — your clinically-inspired sleep coach. Reduce snoring and wake up genuinely refreshed." />
<meta name="theme-color" content="#1E2544" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800&display=swap" rel="stylesheet">

<!-- PWA -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dr. Never Snore">
</head>
<body>
  <div id="app"></div>
  <!-- Boot-error catcher: surfaces any startup error on screen (incl. a bundle
       error that would otherwise white-screen before React mounts). Only ever
       shows if something actually fails. -->
  <script>
  (function () {
    function show(msg) {
      var host = document.getElementById('app') || document.body;
      var panel = document.getElementById('boot-error');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'boot-error';
        panel.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1E2544;color:#fff;font:15px/1.5 -apple-system,system-ui,sans-serif;padding:28px;overflow:auto;-webkit-overflow-scrolling:touch';
        panel.innerHTML = '<div style="max-width:360px;margin:48px auto;text-align:center"><div style="font-size:34px">🌙</div><h2 style="font-weight:800;font-size:22px;margin:14px 0 6px">We hit a snag loading</h2><p style="color:#AEB4CC;margin:0 0 18px">A startup error stopped the app. The detail below helps us fix it.</p><button id="boot-reload" style="background:#43BACA;color:#1E2544;border:0;border-radius:999px;padding:13px 26px;font-weight:800;font-size:15px">Reload</button><pre id="boot-detail" style="white-space:pre-wrap;word-break:break-word;text-align:left;background:rgba(255,255,255,.06);border-radius:10px;padding:12px;margin-top:18px;color:#9BDCE6;font-size:12px"></pre></div>';
        host.appendChild(panel);
        document.getElementById('boot-reload').addEventListener('click', function () {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).finally(function () { location.reload(); });
          } else { location.reload(); }
        });
      }
      var detail = document.getElementById('boot-detail');
      detail.textContent += msg + '\n';
    }
    window.addEventListener('error', function (e) {
      show((e.message || 'Error') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno + ':' + e.colno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      show('Unhandled rejection: ' + (r && (r.message || r) || 'unknown'));
    });
  })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
